<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 严格 CSP：禁止任何远程资源，离线页完全自包含 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>Oopz - 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      user-select: none;
    }
    .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 13px; color: #8e8e93; margin-bottom: 24px; }
    button {
      padding: 8px 24px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0056cc; }
    button:disabled { background: #48484a; cursor: default; }
    .status { font-size: 12px; color: #ff3b30; margin-top: 16px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h2>网络已断开</h2>
  <p>请检查网络连接后重试</p>
  <button id="retryBtn">重新连接</button>
  <div class="status" id="status"></div>
  <script>
    'use strict'
    // retry URL 由主进程通过 loadFile query 注入，且已经过白名单校验
    const params = new URLSearchParams(window.location.search)
    const retryUrl = params.get('retry') || 'https://web.oopz.cn'
    const statusEl = document.getElementById('status')
    const retryBtn = document.getElementById('retryBtn')
    let navigating = false

    function retry () {
      // 防重入：避免连点触发多次导航
      if (navigating) return
      navigating = true
      retryBtn.disabled = true
      statusEl.textContent = '正在连接...'
      window.location.href = retryUrl
    }

    retryBtn.addEventListener('click', retry)

    // ⚠️ 不要用 window 'online' 事件做自动重连。
    // Electron 官方文档明确指出 navigator.onLine 是「在线弱指示」：
    // 只要存在任意可用网络接口（含虚拟机 always-connected 网卡）就返回 true。
    // 该事件在离线页加载瞬间几乎必然误触发 →
    //   跳转 → 加载失败 → did-fail-load 跳回离线页 → online 再触发 → 无限死循环。
    // 网络恢复由用户手动点按钮重试，行为可预期。
  </script>
</body>
</html>
