name: CI

# 只做验证，不发版；发版仍然由 release.yml（tag 触发）负责。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # 部分 npm 版本会拦截依赖的 install 脚本，导致 electron 的二进制没下载。
      # install.js 是幂等的：已安装时直接退出，不会重复下载。
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Syntax check
        run: npm run check

      - name: Offline page smoke test
        run: npm run test:smoke

      - name: Package (dir)
        run: npm run build
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify Electron fuses
        run: npm run test:fuses

      - name: Verify app boots
        run: npm run test:boot
