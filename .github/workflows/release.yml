name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一分支的重复 tag 触发时取消旧构建，避免并发发布互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Check syntax
        run: npm run check

      - name: Build DMG (dual arch)
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify and collect DMG files
        id: artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/*.dmg 2>/dev/null || true
          echo ""

          ARM64_DMG=$(find dist -maxdepth 1 -name '*.dmg' | grep -i arm64 | head -1)
          X64_DMG=$(find dist -maxdepth 1 -name '*.dmg' | grep -v arm64 | grep -v blockmap | head -1)

          echo "arm64 DMG: $ARM64_DMG"
          echo "x64  DMG : $X64_DMG"

          if [ -z "$ARM64_DMG" ] || [ ! -f "$ARM64_DMG" ]; then
            echo "❌ arm64 DMG not found"
            exit 1
          fi
          if [ -z "$X64_DMG" ] || [ ! -f "$X64_DMG" ]; then
            echo "❌ x64 DMG not found"
            exit 1
          fi

          echo "✅ Both DMG files ready"
          echo "arm64_dmg=$ARM64_DMG" >> $GITHUB_OUTPUT
          echo "x64_dmg=$X64_DMG"     >> $GITHUB_OUTPUT
          echo "arm64_name=$(basename $ARM64_DMG)" >> $GITHUB_OUTPUT
          echo "x64_name=$(basename $X64_DMG)"     >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## Oopz ${TAG}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 文件 | 架构 | 适用机型 |"
            echo "|------|------|----------|"
            echo "| \`${{ steps.artifacts.outputs.arm64_name }}\` | Apple Silicon (arm64) | M1 / M2 / M3 / M4 系列 Mac |"
            echo "| \`${{ steps.artifacts.outputs.x64_name }}\` | Intel (x64) | Intel 芯片 Mac |"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 更新日志"
              echo ""
              echo "\`\`\`"
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges
              echo ""
              echo "\`\`\`"
            else
              echo "### 首次发布 🎉"
            fi
            echo ""
            echo "### 安装说明"
            echo ""
            echo "由于本应用未签名，macOS 可能会提示「无法验证开发者」。"
            echo ""
            echo "**解决方法（二选一）：**"
            echo "1. 右键点击 Oopz.app → 选择「打开」→ 在弹窗中再次点击「打开」"
            echo "2. 系统设置 → 隐私与安全性 → 找到「已阻止使用 Oopz…」→ 点击「仍要打开」"
          } > release_notes.md

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Oopz ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            dist/latest-mac.yml
            ${{ steps.artifacts.outputs.arm64_dmg }}.blockmap
            ${{ steps.artifacts.outputs.x64_dmg }}.blockmap
            ${{ steps.artifacts.outputs.arm64_dmg }}
            ${{ steps.artifacts.outputs.x64_dmg }}
