name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG for arm64
        run: npx electron-builder --mac --arm64 --publish never

      - name: Build DMG for x64
        run: npx electron-builder --mac --x64 --publish never

      - name: Verify and collect DMG files
        id: artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/*.dmg 2>/dev/null || true
          echo ""

          # arm64 DMG：文件名含 arm64
          ARM64_DMG=$(find dist -maxdepth 1 -name '*.dmg' | grep -i arm64 | head -1)

          # x64 DMG：electron-builder 对 x64 不加架构后缀，排除 arm64 文件即可
          X64_DMG=$(find dist -maxdepth 1 -name '*.dmg' | grep -v arm64 | grep -v blockmap | head -1)

          echo "arm64 DMG: $ARM64_DMG"
          echo "x64  DMG : $X64_DMG"

          # 验证两个文件都存在
          if [ -z "$ARM64_DMG" ] || [ ! -f "$ARM64_DMG" ]; then
            echo "❌ arm64 DMG not found"
            exit 1
          fi
          if [ -z "$X64_DMG" ] || [ ! -f "$X64_DMG" ]; then
            echo "❌ x64 DMG not found"
            exit 1
          fi

          echo "✅ Both DMG files ready"
          echo "arm64_dmg=$ARM64_DMG" >> $GITHUB_OUTPUT
          echo "x64_dmg=$X64_DMG"     >> $GITHUB_OUTPUT
          echo "arm64_name=$(basename $ARM64_DMG)" >> $GITHUB_OUTPUT
          echo "x64_name=$(basename $X64_DMG)"     >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## Oopz ${TAG}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 文件 | 架构 | 适用机型 |"
            echo "|------|------|----------|"
            echo "| \`${{ steps.artifacts.outputs.arm64_name }}\` | Apple Silicon (arm64) | M1 / M2 / M3 / M4 系列 Mac |"
            echo "| \`${{ steps.artifacts.outputs.x64_name }}\` | Intel (x64) | Intel 芯片 Mac |"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 更新日志"
              echo ""
              echo "\`\`\`"
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges
              echo ""
              echo "\`\`\`"
            else
              echo "### 首次发布 🎉"
            fi
          } > release_notes.md

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Oopz ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.arm64_dmg }}
            ${{ steps.artifacts.outputs.x64_dmg }}
