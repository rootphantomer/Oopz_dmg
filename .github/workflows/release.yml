name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG for arm64
        run: npx electron-builder --mac --arm64 --publish never

      - name: Build DMG for x64
        run: npx electron-builder --mac --x64 --publish never

      - name: Verify DMG files exist
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo ""
          DMG_COUNT=$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          echo "Found ${DMG_COUNT} DMG file(s)"
          if [ "$DMG_COUNT" -lt 2 ]; then
            echo "❌ Expected at least 2 DMG files (arm64 + x64), found ${DMG_COUNT}"
            exit 1
          fi
          echo "✅ DMG files ready"

      - name: Collect DMG paths
        id: artifacts
        run: |
          ARM64_DMG=$(find dist -maxdepth 1 -name '*arm64*.dmg' | head -1)
          X64_DMG=$(find dist -maxdepth 1 -name '*x64*.dmg' | head -1)
          echo "arm64_dmg=$ARM64_DMG" >> $GITHUB_OUTPUT
          echo "x64_dmg=$X64_DMG" >> $GITHUB_OUTPUT
          echo "arm64_name=$(basename $ARM64_DMG)" >> $GITHUB_OUTPUT
          echo "x64_name=$(basename $X64_DMG)" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## Oopz ${TAG}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 文件 | 架构 | 适用机型 |"
            echo "|------|------|----------|"
            echo "| \`${{ steps.artifacts.outputs.arm64_name }}\` | Apple Silicon (arm64) | M1 / M2 / M3 / M4 系列 Mac |"
            echo "| \`${{ steps.artifacts.outputs.x64_name }}\` | Intel (x64) | Intel 芯片 Mac |"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 更新日志"
              echo ""
              echo "\`\`\`"
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges
              echo ""
              echo "\`\`\`"
            else
              echo "### 首次发布 🎉"
            fi
          } > release_notes.md

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Oopz ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.arm64_dmg }}
            ${{ steps.artifacts.outputs.x64_dmg }}
